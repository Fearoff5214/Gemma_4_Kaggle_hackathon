# Baseline v0: plain prompt, the nine harness tools, no skills, sub-agents or
# adapters, and the harness's default generation settings. Its job is to prove
# the format and give the team a score to measure every later change against.
#
# Format: the harness's SandboxedAgentConfig (data/HARNESS_README.md section
# 2.3), as in data/sample_submission/agent.yaml. Tools are bare names.
name: swe_agent
model: gemma-4-31b-it-qat-w4a16-ct
description: Fixes one GitHub issue in a Python repository and submits the patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
