# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
#
# Baseline v0: plain prompt, all nine harness tools, no skills, no sub-agents,
# no adapters. Its only job is to prove the format is valid and give the team a
# score to measure every later change against.
#
# UNVERIFIED until data/HARNESS_README.md is read: field names follow Google
# ADK's AgentConfig schema and what other teams report for this harness.
agent_class: LlmAgent
name: swe_agent
model: gemma-4-31b-it-qat-w4a16-ct
description: Fixes one GitHub issue in a Python repository and submits the patch.
instruction: !include prompts/system.md
tools:
  - name: run_command
  - name: read_file
  - name: edit_file
  - name: write_file
  - name: get_code_neighbors
  - name: search_similar_code
  - name: get_code_subgraph
  - name: get_status
  - name: submit_patch
