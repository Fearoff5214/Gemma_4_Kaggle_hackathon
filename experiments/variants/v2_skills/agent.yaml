# Variant v2_skills: v1_workflow plus two skills, and the prompt paragraph that
# names them. Skills are folder paths inside the archive (HARNESS_README.md
# section 2.3); the harness adds load_skill and the other SkillToolset tools.
#
# Format: the harness's SandboxedAgentConfig, as in
# data/sample_submission/agent.yaml. Tools are bare names.
name: swe_agent
model: gemma-4-31b-it-qat-w4a16-ct
description: Fixes one GitHub issue in a Python repository and submits the patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/repo_navigation
  - skills/running_tests
