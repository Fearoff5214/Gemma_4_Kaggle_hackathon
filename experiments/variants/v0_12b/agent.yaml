# Variant v0_12b: baseline v0 with the 12B model, the only change. 12B is in
# ALLOWED_MODEL_NAMES (HARNESS_README.md 3.2) and reportedly about twice as
# fast as 31b on 4xL4, so the same 4 minutes buy more turns.
#
# Format: the harness's SandboxedAgentConfig (data/HARNESS_README.md section
# 2.3), as in data/sample_submission/agent.yaml. Tools are bare names.
name: swe_agent
model: gemma-4-12b-it-qat-w4a16-ct
description: Fixes one GitHub issue in a Python repository and submits the patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
