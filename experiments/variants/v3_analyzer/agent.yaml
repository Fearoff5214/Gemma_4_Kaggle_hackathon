# Variant v3_analyzer: v1_workflow plus a read-only analyzer sub-agent, and the
# prompt paragraph that names it. It's wired as an agent_tool like
# data/sample_submission/agent.yaml. analyzer.yaml sits at the archive root, so
# no include path needs "..". Compare runtime as well as score: the analyzer's
# calls come out of the same per-task budget.
#
# Format: the harness's SandboxedAgentConfig (data/HARNESS_README.md section 2.3).
name: swe_agent
model: gemma-4-31b-it-qat-w4a16-ct
description: Fixes one GitHub issue in a Python repository and submits the patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: analyzer.yaml
      skip_summarization: true
