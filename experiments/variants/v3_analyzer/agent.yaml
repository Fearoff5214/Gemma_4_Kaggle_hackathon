# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
#
# Variant v3_analyzer: v1_workflow plus a read-only analyzer sub-agent, wrapped
# as an AgentTool so it returns a short report instead of taking over the
# conversation. One change against v1: the sub-agent, and the prompt line
# naming it. Its replies cost extra model time, so compare runtime as well as
# score.
#
# analyzer.yaml sits at the archive root on purpose: see docs/decisions.md on
# how !include paths are resolved.
agent_class: LlmAgent
name: swe_agent
model: gemma-4-31b-it-qat-w4a16-ct
description: Fixes one GitHub issue in a Python repository and submits the patch.
instruction: !include prompts/system.md
tools:
  - name: run_command
  - name: read_file
  - name: edit_file
  - name: write_file
  - name: get_code_neighbors
  - name: search_similar_code
  - name: get_code_subgraph
  - name: get_status
  - name: submit_patch
  - name: AgentTool
    args:
      agent:
        config_path: analyzer.yaml
      skip_summarization: false
