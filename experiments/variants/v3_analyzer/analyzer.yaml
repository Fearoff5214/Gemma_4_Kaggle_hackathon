# Read-only analyzer, reached from agent.yaml as an agent_tool (tool name =
# this agent's name). No run_command, edit_file or write_file, so it can't
# change the repo. It must use the same model as the root agent (section 3.2).
name: code_analyzer
description: Read-only helper. Give it the symbol names and error message from the issue; it locates the files and functions most likely involved and replies with a short report. It never edits files.
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include prompts/analyzer.md
tools:
  - read_file
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
